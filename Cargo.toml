[workspace]
members = [
    "allocative/allocative",
    "allocative/allocative_derive",
    "app/slug_analysis_v2",
    "app/slug_bep_v2",
    "app/slug_build_api_v2",
    "app/slug_bzlmod_v2",
    "app/slug_cli_v2",
    "app/slug_commands_v2",
    "app/slug_core_v2",
    "app/slug_identity_v2",
    "app/slug_loading_v2",
    "app/slug_query_v2",
    "app/slug_reapi_v2",
    "app/slug_server_v2",
    "app/slug_workspace_v2",
    "dice/dice",
    "dice/dice_error",
    "dice/dice_examples",
    "dice/dice_futures",
    "dice/dice_tests",
    # @oss-disable: "dice/fuzzy_dice",
    "dice/read_dump",
    "gazebo/display_container",
    "gazebo/cmp_any",
    "gazebo/gazebo",
    "gazebo/gazebo_derive",
    "gazebo/strong_hash",
    "gazebo/strong_hash_derive",
    "gazebo/strong_hash_tests",
    "pagable",
    "pagable_derive",
    "starlark-rust/starlark",
    "starlark-rust/starlark_bin",
    "starlark-rust/starlark_derive",
    "starlark-rust/starlark_lsp",
    "starlark-rust/starlark_map",
    "starlark-rust/starlark_syntax",
    "shed/setsketch",
    "shed/static_interner",
    "shed/lock_free_hashtable",
    "shed/lock_free_vec",
    "shed/provider",
    "shed/three_billion_instructions",
    "superconsole",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZeromatterOSS/slug"

[workspace.dependencies]
anyhow = "1.0.65"
anymap3 = "1.0.1"
