[fixture]
name = "module-file-directives"
description = "MODULE.bazel directive smoke for include, bazel_dep, local_path_override, use_repo_rule, use_extension, use_repo, inject_repo, override_repo, dev dependencies, and registration order."
comparison = "semantic"
oracle_notes = "Bazel 9.1.1 oracle generated from a local-only bzlmod workspace; the override_repo command proves @generated resolves to the direct repo created by use_repo_rule."

[[commands]]
name = "build_local_override"
argv = ["build", "@dep_alias//:target.txt"]
compare = "semantic"
expected_exit = 0

[[commands]]
name = "query_direct_repo_rule"
argv = ["query", "@direct//:direct.txt"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@direct//:direct.txt"]

[[commands]]
name = "query_override_repo"
argv = ["query", "@generated//:direct.txt"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@direct//:direct.txt"]
