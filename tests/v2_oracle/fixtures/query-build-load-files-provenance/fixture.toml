[fixture]
name = "query-build-load-files-provenance"
description = "Bazel 9.2 ordinary-query oracle for buildfiles/loadfiles transitive provenance and fake .bzl targets."
comparison = "message_shape"
oracle_notes = "Root-repository ordinary-query slice. Discovery established that the same printed fake-load label may project to each consuming package in siblings(), independent of union order; the fixture therefore never claims a request-global owner. No .scl, external repository, generated/output, configured, or action semantics are accepted."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/BuildFilesFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/engine/LoadFilesFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/common/AbstractBlazeQueryEnvironment.java#transitiveLoadFiles",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeQueryEnvironment.java#getTransitiveLoadFilesHelper",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeTargetAccessor.java#getPackage",
  "src/main/java/com/google/devtools/build/lib/query2/common/AbstractBlazeQueryEnvironment.java#TargetKeyExtractor",
  "src/main/java/com/google/devtools/build/lib/query2/compat/FakeLoadTarget.java",
]
translation_notes = "Each separately evaluated load-function invocation can project the same printed label with its consuming package; within one invocation seenBzlLabels label-dedups. Real exported .bzl and fake .bzl operands are intentionally contrasted. Broken companion BUILD syntax/load rows prove output provenance without asserting that PackageLoad succeeded; .bzl load cycles are failure rows."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-build-load-files-provenance --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-build-load-files-provenance --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "buildfiles_direct_primary"
argv = ["query", "buildfiles(//a:one)"]
expected_exit = 0
stdout_patterns = ["\\A//a:BUILD\\.bazel\\n//shared:BUILD\\.bazel\\n//shared:one\\.bzl\\n//shared:two\\.bzl\\Z"]

