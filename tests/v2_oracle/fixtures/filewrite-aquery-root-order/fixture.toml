[fixture]
name = "filewrite-aquery-root-order"
description = "Bazel 9.2 FileWrite aquery retains direct-literal declaration order and proves aspect-free deps owner membership across diamonds, toolchains, delegation, and transitions."
comparison = "message_shape"
oracle_notes = "Direct-literal block order and framing are exact. The deps row proves configured owner membership and deduplication only; concurrent query-set iteration does not support a cross-owner ordering claim."

[provenance]
