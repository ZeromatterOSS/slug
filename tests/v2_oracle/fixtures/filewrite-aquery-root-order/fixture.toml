translation_notes = "The root registers z-root.txt before a-root.txt despite reverse lexical order. Its deps closure discriminates a left/right diamond, one-candidate action-bearing selected toolchain implementation, alias delegation, generated-file producer, and transitioned owner. Direct literal output remains exactly two root blocks. deps(//:root) patterns count owners and framing without coupling them to cross-owner iteration order."
generation_command = "python3 -B -m tools.v2_oracle run --fixture filewrite-aquery-root-order --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture filewrite-aquery-root-order --tool bazel --bazel /usr/bin/bazel"

