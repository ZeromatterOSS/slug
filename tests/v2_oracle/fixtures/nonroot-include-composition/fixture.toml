[fixture]
name = "nonroot-include-composition"
description = "Retained-daemon oracle for non-root MODULE.bazel include execution order, diagnostics, invalidation, and recovery."
comparison = "semantic"
daemon = true
oracle_notes = "The baseline marker is exactly outer-before|nested-a|outer-after|repeat-a|repeat-a\\n, proving nested inline execution order and the two raw-label executions of repeat.MODULE.bazel. The final row recovers on the same daemon after a nested runtime failure and a later-fragment compile failure."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/CompiledModuleFile.java: parseAndCompile, checkModuleFileSyntax, runOnThread",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java: compute, advanceHorizon, execModuleFile",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleThreadContext.java: include",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java: include",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleExtensionUsage.java",
  "src/main/java/net/starlark/java/eval/Starlark.java: execFileProgram",
]
translation_notes = "The marker proves shared inline directive order and two executions of one exact raw include label. Reuse of one raw-label-keyed CompiledModuleFile, Program, and predeclared Module is source-derived only: restricted MODULE.bazel code has no valid binding-persistence discriminator. The local-path fixture does not claim registry include behavior."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-include-composition --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-include-composition --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "baseline_nested_order"
argv = ["build", "//:include_order", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/include_order.txt"]

[[commands]]
name = "nested_a_to_b"
argv = ["build", "//:include_order", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/include_order.txt"]

  [[commands.mutations]]
path = "modules/subject/nested.MODULE.bazel"
find = "nested-a"
replace = "nested-b"

[[commands]]
name = "nested_b_to_a"
argv = ["build", "//:include_order", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/include_order.txt"]

  [[commands.mutations]]
path = "modules/subject/nested.MODULE.bazel"
find = "nested-b"
replace = "nested-a"

[[commands]]
name = "nested_runtime_failure"
argv = ["build", "//:nested_runtime_failure", "--lockfile_mode=off"]
expected_exit = 48
stderr_contains = ["nested.MODULE.bazel:2:5: Traceback", "File \"@@subject+//:MODULE.bazel\", line 3, column 8", "outer.MODULE.bazel\", line 3, column 8", "include(\"//:nested.MODULE.bazel\")", "nested include runtime sentinel", "error executing MODULE.bazel file for subject@_"]
stderr_patterns = ["(?s).*MODULE[.]bazel\", line 3, column 8.*outer[.]MODULE[.]bazel\", line 3, column 8.*nested[.]MODULE[.]bazel\", line 2, column 5.*nested include runtime sentinel.*"]
manifest_roots = ["bazel-bin/nested_runtime_failure.txt"]

  [[commands.mutations]]
path = "modules/subject/nested.MODULE.bazel"
find = "nested.tag(value = \"nested-a\")"
replace = "fail(\"nested include runtime sentinel\")"

[[commands]]
name = "later_fragment_scope_failure"
argv = ["build", "//:scope_failure", "--lockfile_mode=off"]
expected_exit = 48
stderr_contains = ["late.MODULE.bazel:1:20: name 'undefined_late_symbol' is not defined", "syntax error in MODULE.bazel file for <root>"]
stderr_patterns = ["(?s)\\A(?!.*bad!runtime-name).*late[.]MODULE[.]bazel:1:20: name 'undefined_late_symbol' is not defined.*"]
manifest_roots = ["bazel-bin/scope_failure.txt"]

  [[commands.mutations]]
path = "modules/subject/nested.MODULE.bazel"
find = "fail(\"nested include runtime sentinel\")"
replace = "nested.tag(value = \"nested-a\")"

  [[commands.mutations]]
path = "modules/subject/MODULE.bazel"
find = "include(\"//:outer.MODULE.bazel\")"
replace = "bazel_dep(name = \"bad!runtime-name\", version = \"1.0.0\")\ninclude(\"//:outer.MODULE.bazel\")"

  [[commands.mutations]]
path = "modules/subject/late.MODULE.bazel"
find = "late_value = \"late-ok\""
replace = "late_scope_error = undefined_late_symbol"

[[commands]]
name = "final_same_daemon_recovery"
argv = ["build", "//:include_order", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/include_order.txt"]

  [[commands.mutations]]
path = "modules/subject/MODULE.bazel"
find = "bazel_dep(name = \"bad!runtime-name\", version = \"1.0.0\")\ninclude(\"//:outer.MODULE.bazel\")"
replace = "include(\"//:outer.MODULE.bazel\")"

  [[commands.mutations]]
path = "modules/subject/late.MODULE.bazel"
find = "late_scope_error = undefined_late_symbol"
replace = "late_value = \"late-ok\""
