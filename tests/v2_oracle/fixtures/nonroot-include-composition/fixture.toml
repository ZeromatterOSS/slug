[fixture]
name = "nonroot-include-composition"
description = "Retained-daemon oracle for non-root MODULE.bazel include execution order and package policy: BUILD filename priority and fallback, source-order discovery, symlink markers, deleted-package identity, repository ignores, diagnostics, invalidation, and recovery."
comparison = "semantic"
daemon = true
oracle_notes = "The baseline marker is exactly outer-before|nested-a|outer-after|repeat-a|repeat-a\\n, proving nested inline execution order and the two raw-label executions of repeat.MODULE.bazel. The original final row recovers on the same daemon after a nested runtime failure and a later-fragment compile failure. The first five appended rows prove package lookup precedes included-fragment execution, both BUILD filenames are accepted, a source-attributed nonregistry print occurs only when evaluation executes and is not replayed on an unchanged warm request, package deletion fails before execution, and BUILD.bazel recreation recovers. The final fifteen rows prove BUILD.bazel priority and BUILD fallback transitions, line-4 then line-5 source-order discovery and execution, an unchanged output digest, symlink-to-file marker acceptance and removal, canonical rather than apparent --deleted_packages identity, external .bazelignore rejection and clearing, and REPO.bazel ignore_directories rejection and mutation recovery."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/CompiledModuleFile.java: parseAndCompile, checkModuleFileSyntax, runOnThread",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java: compute, advanceHorizon, execModuleFile",
  "src/main/java/com/google/devtools/build/lib/skyframe/PackageLookupFunction.java: compute, computeExternalPackageLookupValue, explainNoBuildFileValue",
  "src/main/java/com/google/devtools/build/lib/skyframe/PackageLookupValue.java: DELETED_PACKAGE_VALUE",
  "src/main/java/com/google/devtools/build/lib/skyframe/IgnoredSubdirectoriesFunction.java: computeIgnoredPrefixes, compute",
  "src/main/java/com/google/devtools/build/lib/packages/RepoFileGlobals.java: ignoreDirectories",
  "src/main/java/com/google/devtools/build/lib/pkgcache/PackageOptions.java: CommaSeparatedPackageNameListConverter.convert, getDeletedPackagesOrEmptySet",
  "src/main/java/com/google/devtools/build/lib/skyframe/BazelSkyframeExecutorConstants.java: BUILD_FILES_BY_PRIORITY",
  "src/main/java/com/google/devtools/build/lib/actions/FileValue.java: isFile",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleThreadContext.java: include",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java: include",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleExtensionUsage.java",
  "src/main/java/net/starlark/java/eval/Starlark.java: execFileProgram",
]
translation_notes = "The marker proves shared inline directive order and two executions of one exact raw include label. Reuse of one raw-label-keyed CompiledModuleFile, Program, and predeclared Module is source-derived only: restricted MODULE.bazel code has no valid binding-persistence discriminator. The boundary fragments remain present while package policy changes, so failures isolate lookup rather than missing-fragment behavior. Their prints and extension tags prove line-4 then line-5 discovery and execution only after both packages succeed; unchanged-marker rows prove cached values do not replay evaluation-time debug events. BUILD.bazel precedes BUILD, while FileValue.isFile accepts a symlink to a regular file. Deleted-package matching uses parsed PackageIdentifier identity, and external .bazelignore plus REPO.bazel ignore_directories feed the deleted-package lookup result. Registry print behavior remains in registry-module-discovery-recovery."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-include-composition --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-include-composition --tool bazel --bazel /usr/bin/bazel"

