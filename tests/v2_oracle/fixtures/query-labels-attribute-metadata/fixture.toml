[fixture]
name = "query-labels-attribute-metadata"
description = "Bazel 9.2 ordinary-query oracle for labels() attribute metadata, selector reachability, and output targets."
comparison = "message_shape"
oracle_notes = "Root-repository ordinary-query metadata gate only. This fixture establishes loading-owned attribute schema/coercion/provenance and the later labels() projection; it accepts neither regex, configured-query, visibility, executable, nor test semantics."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/LabelsFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeTargetAccessor.java#getPrerequisites",
  "src/main/java/com/google/devtools/build/lib/packages/AggregatingAttributeMapper.java#getReachableLabels",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkAttrModuleApi.java#labelAttribute",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkAttrModuleApi.java#labelListAttribute",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkAttrModuleApi.java#stringKeyedLabelDictAttribute",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkAttrModuleApi.java#labelKeyedStringDictAttribute",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkAttrModuleApi.java#labelListDictAttribute",
  "src/main/java/com/google/devtools/build/lib/packages/BuildType.java#LABEL_DICT_UNARY",
  "src/main/java/com/google/devtools/build/lib/packages/BuildType.java#LABEL_KEYED_STRING_DICT",
  "src/main/java/com/google/devtools/build/lib/packages/BuildType.java#LABEL_LIST_DICT",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeQueryEnvironment.java#getTargetsMatchingPatternImpl",
  "src/main/java/com/google/devtools/build/lib/query2/query/LabelVisitor.java#visitTargetNode",
  "src/main/java/com/google/devtools/build/lib/packages/OutputFile.java#getGeneratingRule",
  "src/main/java/com/google/devtools/build/lib/packages/OutputFile.java#getTargetKind",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testLabelsOperator",
]
translation_notes = "The public unconfigured label-bearing attr set audited from StarlarkAttrModuleApi/BuildType is label, label_list, string_keyed_label_dict, label_keyed_string_dict, label_list_dict, output, and output_list; dormant_label variants are experimental/documented false and excluded. BlazeTargetAccessor calls getReachableLabels(attribute, false): selector condition keys are excluded. Direct labels(outs, ...) returns generated targets; output graph/deps observers distinguish each producer. Mandatory-attribute and fail-fast missing-prerequisite rows retain observed Bazel behavior."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-labels-attribute-metadata --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-labels-attribute-metadata --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "scalar_explicit"
argv = ["query", "labels(one, //pkg:explicit)"]
expected_exit = 0
stdout_patterns = ["\\A//pkg:source\\.txt\\n?\\Z"]

