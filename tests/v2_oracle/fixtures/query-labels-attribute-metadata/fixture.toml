translation_notes = "LabelParser.Parts.parse and Label.parseWithPackageContext distinguish bare names, package-relative :names, and root-absolute labels; LabelConverter applies the active package context. BuildType conversion applies that context to explicit BUILD values, while StarlarkAttrModule defaultValue uses LabelConverter.forBzlEvaluatingThread so a .bzl-defined default remains rooted at its defining package. RuleClass invokes AggregatingAttributeMapper after conversion and rejects duplicate canonical labels in every direct LABEL_LIST, so equivalent bare and colon spellings fail for both native filegroup srcs and a direct unconditional Starlark label_list. Configurable selector duplicate semantics are not claimed. The public unconfigured label-bearing attr set audited from StarlarkAttrModuleApi/BuildType is label, label_list, string_keyed_label_dict, label_keyed_string_dict, label_list_dict, output, and output_list; dormant_label variants are experimental/documented false and excluded. AttributeProvider carries the resulting loading representation. BlazeTargetAccessor calls getReachableLabels(attribute, false): selector condition keys are excluded. Direct labels(outs, ...) returns generated targets; output graph/deps observers distinguish each producer. FilegroupRule supplies native srcs while RuleOrMacroInstance retains whether it was explicitly specified; BuildOutputFormatter/ProtoOutputFormatter consume that provenance. This oracle is loading-representation-only: its build-format rows require state distinctions but grant no Slug formatter acceptance. Mandatory-attribute, invalid-relative-label, duplicate-label, and fail-fast missing-prerequisite rows retain observed Bazel behavior."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-labels-attribute-metadata --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-labels-attribute-metadata --tool bazel --bazel /usr/bin/bazel"

