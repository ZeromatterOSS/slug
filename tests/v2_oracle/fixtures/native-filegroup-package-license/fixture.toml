translation_notes = "The root BUILD declares only a package license and a source filegroup. The cquery row proves the filegroup configures with inherited notice; separate focused Analysis tests protect provenance and fail-closed boundaries."
generation_command = "python3 -B -m tools.v2_oracle run --fixture native-filegroup-package-license --tool bazel --bazel /usr/bin/bazel --run-root <fresh-generation-root> --update-expected"
