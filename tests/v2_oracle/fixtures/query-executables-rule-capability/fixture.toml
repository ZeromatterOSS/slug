[fixture]
name = "query-executables-rule-capability"
payload_workspace = "query-executables-rule-capability"
initial_tree_hash = "7d320eb69086edf9ca85ca512d65b7259baabc7ac35fa7077c011536a57af227"
description = "Bazel 9.2 ordinary-query oracle for the exact executables() rule-capability predicate."
comparison = "message_shape"
oracle_notes = "Root-repository current-loadable-graph gate only. It distinguishes per-target executable capability from exported Starlark rule-class identity, not BUILD target spelling or implementation identity. In Bazel rule() creation, test=True forces executable capability even when executable=False is supplied; that probe establishes accepted syntax plus exported *_test exclusion only, never a false capability. The executables() predicate remains Rule.isExecutable() plus non-test-class exclusion, not test || executable. The representation-only --output=label_kind rows pin upstream class names and are excluded from Stage 8 Slug formatter acceptance. Native genrule and test_suite are deliberately absent and remain separate substrate gates."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/ExecutablesFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeTargetAccessor.java#isExecutableNonTestRule",
  "src/main/java/com/google/devtools/build/lib/packages/TargetUtils.java#isExecutableNonTestRule",
  "src/main/java/com/google/devtools/build/lib/packages/TargetUtils.java#isTestRuleName",
  "src/main/java/com/google/devtools/build/lib/packages/Rule.java#isExecutable",
  "src/main/java/com/google/devtools/build/lib/starlarkbuildapi/StarlarkRuleFunctionsApi.java#rule",
  "src/main/java/com/google/devtools/build/lib/analysis/starlark/StarlarkRuleClassFunctions.java#rule",
  "src/main/java/com/google/devtools/build/lib/analysis/starlark/StarlarkRuleClassFunctions.java#getTestBaseRule",
  "src/main/java/com/google/devtools/build/lib/analysis/starlark/StarlarkRuleClassFunctions.java#createRule",
  "src/main/java/com/google/devtools/build/lib/analysis/starlark/StarlarkRuleClassFunctions.java#StarlarkRuleFunction.export",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testExecutablesQuery",
]
translation_notes = "The success workspace uses only Starlark rule(), filegroup, alias, config_setting, source, output, and active BUILD nodes supported by the current loading graph. Separate packages isolate invalid exported rule definitions and the test=True/executable=False acceptance probe. At the pinned StarlarkRuleClassFunctions#createRule source, test=True selects getTestBaseRule and independently calls setExecutableStarlark() through executable || test, so explicit executable=False is accepted but does not make a test non-executable. Its empty executables() result observes only the exported *_test exclusion. Query classification is Rule.isExecutable() plus non-test-class exclusion, never a test || executable predicate. Exact stdout patterns pin the ordinary-query surface; graph rows pin a no-edge filter over an edge-bearing operand. The --output=label_kind representation-only rows pin Bazel class names, but are deliberately excluded from Stage 8 Slug formatter acceptance."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-executables-rule-capability --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-executables-rule-capability --tool bazel --bazel /usr/bin/bazel"

