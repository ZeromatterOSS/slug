stdout_patterns = ["(?s)\\A(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0)(?=.*subject@1\\.0\\.0)(?=.*shared@2\\.0\\.0).*"]

  [[commands.mutations]]
  path = "registry/modules/subject/1.0.0/MODULE.bazel"
  find = "bazel_compatibility = [\"<=9.1.0\"]"
  replace = "bazel_compatibility = [\">=9.0.0\"]"

  [[commands.mutations]]
