[fixture]
name = "nonroot-interim-module-graph"
description = "Bazel 9.2 registry nonroot InterimModule graph semantics and local directory transport."
comparison = "message_shape"
daemon = true
oracle_notes = "A retained local registry isolates nonroot graph semantics. subject's nodep shared@2 request upgrades root-introduced shared@1 without becoming a subject edge; the subject's dev dependency and single_version_override are ignored. Nonzero compatibility_level and max_compatibility_level are Bazel 9 no-op source inputs only. Five appended semantic rows select the previously ignored devonly module and move its local-registry MODULE.bazel through ordinary, directory-listing, mutable-metadata fail-open, absent, and exact restoration states while comparing the visible lockfile."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleThreadContext.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/InterimModule.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleBase.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/IndexRegistry.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/YankedVersionsFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RepoSpecFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelModuleResolutionFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ArchiveRepoSpecBuilder.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelLockFileModule.java",
]
translation_notes = "Bazel 9.2 ModuleFileGlobals stores compatibility_level as 0 and max_compatibility_level as -1; this fixture does not infer those internal values from command output. Nonroot execution ignores dev dependencies and module overrides. The observed Azul OpenJDK 25.0.2 file URL handler sorts a directory's direct names and transports their newline-terminated listing. IndexRegistry checksums MODULE.bazel bytes for remote_module_file_integrity but fetches mutable metadata.json without a checksum; YankedVersionsFunction warns and fails open on metadata parse failure. BazelLockFileModule filters file: registry hashes from the visible lockfile, permitting exact distinct-root replay."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-interim-module-graph --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-interim-module-graph --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "nonroot_graph_keeps_ordinary_edge_suppresses_dev_and_nodep_edge"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["subject@1.0.0", "dep@1.0.0", "shared@2.0.0"]
stdout_patterns = ["(?s)\\A(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0)(?=.*subject@1\\.0\\.0)(?=.*dep@1\\.0\\.0)(?=.*shared@2\\.0\\.0).*"]

[[commands]]
name = "nodep_upgrades_root_shared_but_is_not_subject_dependency"
argv = ["mod", "deps", "subject@1.0.0", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["subject@1.0.0", "dep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*shared@2\\.0\\.0)(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0).*subject@1\\.0\\.0.*dep@1\\.0\\.0.*"]

[[commands]]
name = "subject_apparent_dependency_alias_maps_to_canonical_repo"
argv = ["mod", "dump_repo_mapping", "subject+", "--output=json", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["dep_alias", "dep+"]
stdout_patterns = ["(?s)\\A(?!.*devonly).*dep_alias.*dep\\+.*"]

[[commands]]
name = "incompatible_nonroot_bazel_compatibility_fails_after_root_invalidation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 37
stderr_contains = ["Bazel version 9.2.0 is not compatible with module \"subject@1.0.0\"", "Bazel compatibility check failed"]

  [[commands.mutations]]
  path = "registry/modules/subject/1.0.0/MODULE.bazel"
  find = "bazel_compatibility = [\">=9.0.0\"]"
  replace = "bazel_compatibility = [\"<=9.1.0\"]"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.0\""
  replace = "version = \"0.1.1\""

[[commands]]
name = "compatible_nonroot_bazel_compatibility_recovers_after_root_invalidation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["subject@1.0.0", "shared@2.0.0"]
stdout_patterns = ["(?s)\\A(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0)(?=.*subject@1\\.0\\.0)(?=.*shared@2\\.0\\.0).*"]

  [[commands.mutations]]
  path = "registry/modules/subject/1.0.0/MODULE.bazel"
  find = "bazel_compatibility = [\"<=9.1.0\"]"
  replace = "bazel_compatibility = [\">=9.0.0\"]"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.1\""
  replace = "version = \"0.1.2\""

[[commands]]
name = "nonroot_builtin_apparent_name_collision_is_fatal"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 37
stderr_contains = ["The repo name 'bazel_tools' cannot be defined as a built-in dependency", "by a bazel_dep"]
stderr_patterns = ["(?s)\\A(?!.*dep@2\\.0\\.0).*bazel_tools.*built-in dependency.*"]

  [[commands.mutations]]
  path = "registry/modules/subject/1.0.0/MODULE.bazel"
  find = "single_version_override(module_name = \"dep\", version = \"2.0.0\")"
  replace = "single_version_override(module_name = \"dep\", version = \"2.0.0\")\nbazel_dep(name = \"collision\", version = \"1.0.0\", repo_name = \"bazel_tools\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.2\""
  replace = "version = \"0.1.3\""

[[commands]]
name = "regular_local_registry_file_baseline"
argv = ["mod", "show_repo", "@@devonly+", "--lockfile_mode=update", "--registry=file://%workspace%/registry"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["remote_module_file_integrity = \"sha256-rSW46GS1ppd2SDhQBqh7i7e1O4oG6NK91hvTWEjKYVQ=\""]
stdout_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL).*"]
stderr_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL)(?!.*Could not read metadata file).*"]
manifest_roots = ["MODULE.bazel.lock"]

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "bazel_dep(name = \"subject\", version = \"1.0.0\")\nbazel_dep(name = \"shared\", version = \"1.0.0\")"
  replace = "bazel_dep(name = \"devonly\", version = \"1.0.0\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.3\""
  replace = "version = \"0.1.4\""

[[commands]]
name = "directory_module_listing_bytes_and_checksum"
argv = ["mod", "show_repo", "@@devonly+", "--lockfile_mode=update", "--registry=file://%workspace%/registry"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["remote_module_file_integrity = \"sha256-C9Ew3zKolMQLXRmvq5iMfIvrShNOzOxHRORhnWbbFAg=\""]
stdout_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL).*"]
stderr_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL)(?!.*Could not read metadata file)(?!.*Is a directory).*"]
manifest_roots = ["MODULE.bazel.lock"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/1.0.0/MODULE.bazel"
  destination = "registry/modules/devonly/1.0.0/MODULE.regular"

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/1.0.0/MODULE.directory-link"
  destination = "registry/modules/devonly/1.0.0/MODULE.bazel"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.4\""
  replace = "version = \"0.1.5\""

[[commands]]
name = "mutable_metadata_directory_lists_then_fails_open"
argv = ["mod", "show_repo", "@@devonly+", "--lockfile_mode=refresh", "--registry=file://%workspace%/registry"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["## @@devonly+:", "http_archive(", "remote_module_file_integrity = \"sha256-C9Ew3zKolMQLXRmvq5iMfIvrShNOzOxHRORhnWbbFAg=\""]
stdout_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL).*"]
stderr_contains = ["Could not read metadata file for module devonly from registry", "registry/modules/devonly/metadata.json", "Expected BEGIN_OBJECT but was STRING at line 1 column 1 path $"]
stderr_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL)(?!.*Is a directory)(?!.*Yanked version detected).*"]
manifest_roots = ["MODULE.bazel.lock"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/metadata.directory-link"
  destination = "registry/modules/devonly/metadata.json"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.5\""
  replace = "version = \"0.1.6\""

[[commands]]
name = "parked_directory_links_are_absent"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
compare = "semantic"
expected_exit = 37
stderr_contains = ["module devonly@1.0.0 not found in registries:", "registry/modules/devonly/1.0.0/MODULE.bazel: not found"]
stderr_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL)(?!.*declares a different name)(?!.*Could not read metadata file)(?!.*Is a directory).*"]
manifest_roots = ["MODULE.bazel.lock"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/1.0.0/MODULE.bazel"
  destination = "registry/modules/devonly/1.0.0/MODULE.directory-link"

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/metadata.json"
  destination = "registry/modules/devonly/metadata.directory-link"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.6\""
  replace = "version = \"0.1.7\""

[[commands]]
name = "regular_local_registry_file_restores_exactly"
argv = ["mod", "show_repo", "@@devonly+", "--lockfile_mode=update", "--registry=file://%workspace%/registry"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["remote_module_file_integrity = \"sha256-rSW46GS1ppd2SDhQBqh7i7e1O4oG6NK91hvTWEjKYVQ=\""]
stdout_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL).*"]
stderr_patterns = ["(?s)\\A(?!.*DIRECTORY_LISTING_SENTINEL)(?!.*Could not read metadata file).*"]
manifest_roots = ["MODULE.bazel.lock"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/modules/devonly/1.0.0/MODULE.regular"
  destination = "registry/modules/devonly/1.0.0/MODULE.bazel"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.7\""
  replace = "version = \"0.1.4\""
