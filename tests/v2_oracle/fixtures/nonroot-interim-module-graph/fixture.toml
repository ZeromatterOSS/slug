[fixture]
name = "nonroot-interim-module-graph"
description = "Bazel 9.2 registry nonroot InterimModule graph semantics and exact local directory collation/charset transport."
comparison = "message_shape"
daemon = true
oracle_notes = "A retained local registry isolates nonroot graph semantics. subject's nodep shared@2 request upgrades root-introduced shared@1 without becoming a subject edge; the subject's dev dependency and single_version_override are ignored. Nonzero compatibility_level and max_compatibility_level are Bazel 9 no-op source inputs only. Eight appended semantic rows select the previously ignored devonly module and move its local-registry MODULE.bazel through ordinary, ASCII directory-listing, mutable-metadata fail-open, absent, exact restoration, ROOT-collated ISO-8859-1 directory-listing, empty followed-directory, and final ordinary-restoration states while comparing the visible lockfile."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleThreadContext.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/InterimModule.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleBase.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/IndexRegistry.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/YankedVersionsFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RepoSpecFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelModuleResolutionFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ArchiveRepoSpecBuilder.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelLockFileModule.java",
  "src/main/cpp/blaze.cc",
]
translation_notes = "Bazel 9.2 ModuleFileGlobals stores compatibility_level as 0 and max_compatibility_level as -1; this fixture does not infer those internal values from command output. Nonroot execution ignores dev dependencies and module overrides. Bazel's default server launch selects ROOT locale and ISO-8859-1. OpenJDK 25.0.2 source openjdk/jdk25u@405a5699ebd097464ed3fc9345414b0774a2edc9 owns the exact transport matrix: src/java.base/share/classes/sun/net/www/protocol/file/FileURLConnection.java:76-87,180-205; src/java.base/share/classes/java/io/File.java:1004-1058; src/java.base/share/classes/java/util/List.java:445-507; src/java.base/share/classes/java/text/Collator.java:223-340; src/java.base/share/classes/sun/util/locale/provider/CollatorProviderImpl.java:94-124; src/java.base/share/classes/sun/util/locale/provider/CollationRules.java:41+; src/java.base/share/classes/java/lang/String.java:867-877,1025-1058,1871-1885; src/java.base/unix/native/libjava/UnixFileSystem_md.c:104-131,296-358; src/java.base/unix/native/libjava/java_props_md.c:439-467; src/java.base/share/native/libjava/jni_util.c:699-835; and src/java.base/windows/native/libjava/WinNTFileSystem_md.c:219-263,406-428,695-813. These sources pin FileURLConnection direct-name enumeration, stable ROOT RuleBasedCollator sorting, LF termination, ISO-8859-1 replacement, Unix JNU decoding, and Windows UTF-16 enumeration. The portable seven-name directory produces exact 91-byte SRI sha256-XvPSTH8P0MJVFfgfYQPMSsLAvSHGp2uIts690FOHYx4=; the followed empty directory produces a found zero-byte MODULE value. Explicit host_jvm_args charset/collator input remains supported Bazel behavior but is deferred behind WP-5-m1-host-jvm-registry-byte-input-design. IndexRegistry checksums MODULE.bazel bytes for remote_module_file_integrity but fetches mutable metadata.json without a checksum; YankedVersionsFunction warns and fails open on metadata parse failure. BazelLockFileModule filters file: registry hashes from the visible lockfile, permitting exact distinct-root replay."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-interim-module-graph --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-interim-module-graph --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "nonroot_graph_keeps_ordinary_edge_suppresses_dev_and_nodep_edge"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["subject@1.0.0", "dep@1.0.0", "shared@2.0.0"]
stdout_patterns = ["(?s)\\A(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0)(?=.*subject@1\\.0\\.0)(?=.*dep@1\\.0\\.0)(?=.*shared@2\\.0\\.0).*"]

[[commands]]
name = "nodep_upgrades_root_shared_but_is_not_subject_dependency"
argv = ["mod", "deps", "subject@1.0.0", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["subject@1.0.0", "dep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*shared@2\\.0\\.0)(?!.*devonly@1\\.0\\.0)(?!.*dep@2\\.0\\.0).*subject@1\\.0\\.0.*dep@1\\.0\\.0.*"]

[[commands]]
name = "subject_apparent_dependency_alias_maps_to_canonical_repo"
argv = ["mod", "dump_repo_mapping", "subject+", "--output=json", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 0
stdout_contains = ["dep_alias", "dep+"]
stdout_patterns = ["(?s)\\A(?!.*devonly).*dep_alias.*dep\\+.*"]

[[commands]]
name = "incompatible_nonroot_bazel_compatibility_fails_after_root_invalidation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry"]
expected_exit = 37
stderr_contains = ["Bazel version 9.2.0 is not compatible with module \"subject@1.0.0\"", "Bazel compatibility check failed"]

  [[commands.mutations]]
  path = "registry/modules/subject/1.0.0/MODULE.bazel"
  find = "bazel_compatibility = [\">=9.0.0\"]"
  replace = "bazel_compatibility = [\"<=9.1.0\"]"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.0\""
  replace = "version = \"0.1.1\""

[[commands]]
name = "compatible_nonroot_bazel_compatibility_recovers_after_root_invalidation"
