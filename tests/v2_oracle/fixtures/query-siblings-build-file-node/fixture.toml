[fixture]
name = "query-siblings-build-file-node"
description = "Bazel 9.2 ordinary-query oracle for siblings() and actual package BUILD-file target basenames."
comparison = "message_shape"
oracle_notes = "Root-repository loading-query slice only. BUILD-file labels follow the active loaded basename (BUILD.bazel preferred over BUILD); exports_files of that active file is observed exactly once. No buildfiles/loadfiles/fake .bzl, kind/regex, generated/output, external, configured, or action semantics are claimed."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/SiblingsFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/engine/QueryEnvironment.java#TargetAccessor",
  "src/main/java/com/google/devtools/build/lib/pkgcache/PackageProvider.java",
  "src/main/java/com/google/devtools/build/lib/packages/Package.java",
  "src/test/java/com/google/devtools/build/lib/packages/PackageFactoryTest.java",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSiblings_simple",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSiblings_duplicatePackages",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSiblings_samePackageRdeps",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSiblings_matchesTargetNamedAll",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSiblings_withBuildfiles",
]
translation_notes = "Ports only siblings package projection and PackageProvider active-BUILD basename behavior into a root-only graph. AbstractQueryTest kind/buildfiles interactions are source themes for node containment and are deliberately not accepted Slug commands. BUILD and BUILD.bazel targets are ordinary source-like query targets with zero dependency edges in the intended V2 packet."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-siblings-build-file-node --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-siblings-build-file-node --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "modern_actual_build_bazel"
argv = ["query", "//modern:BUILD.bazel"]
expected_exit = 0
stdout_patterns = ["\\A//modern:BUILD\\.bazel\\Z"]

[[commands]]
name = "modern_wrong_build_missing"
argv = ["query", "//modern:BUILD"]
expected_exit = 7
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such target '//modern:BUILD'"]

