[fixture]
name = "registry-module-discovery-recovery"
description = "Bazel 9.2 local registry discovery, recovery, print silence, declaration defaults, and nonroot evaluation ordering."
comparison = "message_shape"
oracle_notes = "One retained local file-registry workspace first isolates discovery cache replay: absence, first creation, cached success after a malformed-first mutation, root-version invalidation, repair, and deletion fallback. Five later rows isolate a validation module and prove registry include rejection before execution, execution before declaration validation, name before version, and corrected success. Three appended rows prove registry print is silent, omitted module() retains Bazel's empty declared name and fails name before version after execution, and restoration recovers silently. All rows disable lockfile replay. Minimal Bazel 9.2 embedded-tools direct-module declarations and extension stubs are deterministic scaffolding only, not asserted registry evidence."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/BazelRepositoryModule.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/CompiledModuleFile.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleThreadContext.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/InterimModule.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RegistryFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/IndexRegistry.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RegistryFactoryImpl.java",
]
translation_notes = "The malformed mutation leaves the root module version unchanged, proving same-key cache replay. Subsequent distinct root versions force re-evaluation: malformed first data is fatal without second fallback, repair selects repaireddep, and deletion selects seconddep. The validation rows replace aaa and advance the root version on every mutation so each diagnostic is attributable to the isolated validation module and a fresh local-registry module evaluation. The appended rows retain print while removing only module(), so silent execution is followed by the empty declared-name check; conditional version validation remains pinned-source-backed."
generation_command = "python3 -B -m tools.v2_oracle run --fixture registry-module-discovery-recovery --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture registry-module-discovery-recovery --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "both_absent_ordered_failure"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["module aaa@1.0.0 not found in registries:"]

[[commands]]
name = "create_first_selects_first"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["aaa@1.0.0", "firstdep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*seconddep@1\\.0\\.0).*firstdep@1\\.0\\.0"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/first/modules/aaa/1.0.0/MODULE.pending"
  destination = "registry/first/modules/aaa/1.0.0/MODULE.bazel"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "# discovery-transition: absent"
  replace = "# discovery-transition: first"


[[commands]]
name = "cached_success_after_malformed_first"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["aaa@1.0.0", "firstdep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*repaireddep@1\\.0\\.0)(?!.*seconddep@1\\.0\\.0).*firstdep@1\\.0\\.0"]

  [[commands.mutations]]
  op = "rename"
  path = "registry/second/modules/aaa/1.0.0/MODULE.pending"
  destination = "registry/second/modules/aaa/1.0.0/MODULE.bazel"

  [[commands.mutations]]
  path = "registry/first/modules/aaa/1.0.0/MODULE.bazel"
  find = "bazel_dep(name = \"firstdep\", version = \"1.0.0\")"
  replace = "def broken("

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "# discovery-transition: first"
  replace = "# discovery-transition: malformed"


[[commands]]
name = "root_version_invalidation_rejects_malformed_first"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["registry/first/modules/aaa/1.0.0/MODULE.bazel", "error parsing MODULE.bazel file for aaa@1.0.0"]

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "# discovery-transition: malformed"
  replace = "# discovery-transition: malformed-invalidated"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.0\""
  replace = "version = \"0.1.1\""


[[commands]]
name = "repair_first_after_root_invalidation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["aaa@1.0.0", "repaireddep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*firstdep@1\\.0\\.0)(?!.*seconddep@1\\.0\\.0).*repaireddep@1\\.0\\.0"]

  [[commands.mutations]]
  path = "registry/first/modules/aaa/1.0.0/MODULE.bazel"
  find = "def broken("
  replace = "bazel_dep(name = \"repaireddep\", version = \"1.0.0\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "# discovery-transition: malformed-invalidated"
  replace = "# discovery-transition: repaired"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.1\""
  replace = "version = \"0.1.2\""


[[commands]]
name = "delete_first_after_root_invalidation_selects_second"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["aaa@1.0.0", "seconddep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*repaireddep@1\\.0\\.0).*seconddep@1\\.0\\.0"]

  [[commands.mutations]]
  op = "delete"
  path = "registry/first/modules/aaa/1.0.0/MODULE.bazel"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "# discovery-transition: repaired"
  replace = "# discovery-transition: deleted"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.2\""
  replace = "version = \"0.1.3\""


[[commands]]
name = "registry_include_restriction_precedes_execution_and_declaration_validation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["include() directive found", "it can only be used in the root module or in modules with non-registry overrides"]
stderr_patterns = ["(?s)\\A(?!.*validation execution sentinel)(?!.*declares a different name)(?!.*declares a different version).*include\\(\\) directive found.*"]

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "bazel_dep(name = \"aaa\", version = \"1.0.0\")"
  replace = "bazel_dep(name = \"validation\", version = \"1.0.0\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.3\""
  replace = "version = \"0.1.4\""


[[commands]]
name = "registry_execution_failure_precedes_declaration_validation"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["validation execution sentinel"]
stderr_patterns = ["(?s)\\A(?!.*include\\(\\) directive found)(?!.*declares a different name)(?!.*declares a different version).*validation execution sentinel.*"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "include(\"//:validation.MODULE.bazel\")\n"
  replace = ""

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.4\""
  replace = "version = \"0.1.5\""


[[commands]]
name = "registry_name_mismatch_precedes_version_mismatch"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["the MODULE.bazel file of validation@1.0.0 declares a different name (wrong_validation)"]
stderr_patterns = ["(?s)\\A(?!.*validation execution sentinel)(?!.*declares a different version).*declares a different name.*"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "fail(\"validation execution sentinel\")\n"
  replace = ""

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.5\""
  replace = "version = \"0.1.6\""


[[commands]]
name = "registry_version_mismatch_after_name_is_fixed"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["the MODULE.bazel file of validation@1.0.0 declares a different version (2.0.0)"]
stderr_patterns = ["(?s)\\A(?!.*validation execution sentinel)(?!.*declares a different name).*declares a different version.*"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "module(name = \"wrong_validation\", version = \"2.0.0\")"
  replace = "module(name = \"validation\", version = \"2.0.0\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.6\""
  replace = "version = \"0.1.7\""


[[commands]]
name = "registry_declaration_validation_recovers_when_version_is_fixed"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["validation@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*wrong_validation@)(?!.*validation@2\\.0\\.0).*validation@1\\.0\\.0.*"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "module(name = \"validation\", version = \"2.0.0\")"
  replace = "module(name = \"validation\", version = \"1.0.0\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.7\""
  replace = "version = \"0.1.8\""

[[commands]]
name = "registry_print_succeeds_silently"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["validation@1.0.0"]
stderr_patterns = ["(?s)\\A(?!.*REGISTRY_DISCOVERY_PRINT_SENTINEL)(?!.*print\\(\\) is not permitted).*\\Z"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "module(name = \"validation\", version = \"1.0.0\")"
  replace = "module(name = \"validation\", version = \"1.0.0\")\nprint(\"REGISTRY_DISCOVERY_PRINT_SENTINEL\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.8\""
  replace = "version = \"0.1.9\""

[[commands]]
name = "omitted_module_defaults_to_empty_name_before_version"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 37
stderr_contains = ["the MODULE.bazel file of validation@1.0.0 declares a different name ()"]
stderr_patterns = ["(?s)\\A(?!.*declares a different version)(?!.*REGISTRY_DISCOVERY_PRINT_SENTINEL)(?!.*print\\(\\) is not permitted).*declares a different name \\(\\).*\\Z"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "module(name = \"validation\", version = \"1.0.0\")\n"
  replace = ""

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.9\""
  replace = "version = \"0.1.10\""

[[commands]]
name = "restored_module_recovers_with_registry_print_silent"
argv = ["mod", "graph", "--lockfile_mode=off", "--registry=file://%workspace%/registry/first", "--registry=file://%workspace%/registry/second"]
expected_exit = 0
stdout_contains = ["validation@1.0.0"]
stderr_patterns = ["(?s)\\A(?!.*REGISTRY_DISCOVERY_PRINT_SENTINEL)(?!.*print\\(\\) is not permitted).*\\Z"]

  [[commands.mutations]]
  path = "registry/first/modules/validation/1.0.0/MODULE.bazel"
  find = "print(\"REGISTRY_DISCOVERY_PRINT_SENTINEL\")"
  replace = "module(name = \"validation\", version = \"1.0.0\")\nprint(\"REGISTRY_DISCOVERY_PRINT_SENTINEL\")"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.10\""
  replace = "version = \"0.1.11\""
