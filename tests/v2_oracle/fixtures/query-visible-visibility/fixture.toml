translation_notes = "VisibleFunction materializes callers once through QueryUtil.evalAll and retains an input only when every materialized caller can see it; an empty caller set is vacuously true, and each retained input is emitted as a singleton callback delivery. Ordinary BlazeQueryEnvironment target sets use TargetKeyExtractor, which keys real and fake targets by Label rather than Java object equality. Same-label fake callers therefore collapse at predicate materialization; the retained representative still exposes its consuming BUILD package through FakeLoadTarget package metadata. BlazeTargetAccessor always adds same-package access and the one-way matching javatests/X caller to private java/X target. Direct package specifications and recursively expanded package-group contents are OR alternatives. Negatives override positives only inside one PackageGroupContents, so a separate direct or included positive can re-allow a package. Top-level groups and includes may cross package boundaries through ordinary query target lookup. Real generated/source/BUILD targets retain real visibility; package_group and fake load targets are public. A streamed real-first real/fake same-label input still permits the later public fake candidate before final label output materialization. Bazel 9.2 PackageOptions defaults incompatible_enforce_config_setting_visibility to true and incompatible_config_setting_private_default_visibility to false, so SkyframeExecutor selects ConfigSettingVisibilityPolicy.DEFAULT_PUBLIC. Rule.getDefaultVisibility then makes an omitted config_setting visibility public while preserving and enforcing an explicit package-group restriction. LabelsFunction calls TargetAccessor.getPrerequisites; BlazeTargetAccessor.getPrerequisites then calls AggregatingAttributeMapper.getReachableLabels over the stored/raw rule attribute. visitRawNonConfigurableAttributeValue is the mapper's related declared-visibility special case, not this LabelsFunction call path. Explicit loadable group labels project as targets, omitted visibility stays empty even when the package default names a group, explicit direct __pkg__/__subpackages__ values are retained but fail target lookup because they are non-loadable pseudo-labels, and omitted visibility with direct package defaults stays empty. In contrast, deps and LabelVisitationUtils use effective visibility dependency labels, including inherited groups; direct package specifications remain visibility values but never dependency targets. The bazel_only_structure rows document flag-sensitive graph distinctions without authorizing those flags for Slug."
