[fixture]
name = "rules-rust-073-toolchain-owner"
description = "Bazel 9.2/rules_rust 0.73 extension-generated toolchain mapping, provider projection, and configured Rust action ownership."
comparison = "message_shape"
daemon = true
startup_argv = ["--ignore_all_rc_files"]
oracle_notes = "Analysis-only M7A evidence. Canonical generated-repository labels, CrateInfo fields, selected platform, action order, and opaque ActionKey equality/restoration are exact; configuration and ActionKey bytes are not claimed."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/skyframe/toolchains/RegisteredToolchainsFunction.java#getBzlmodToolchains",
  "src/main/java/com/google/devtools/build/lib/skyframe/TargetPatternUtil.java#expandTargetPatterns",
  "src/main/java/com/google/devtools/build/lib/skyframe/toolchains/SingleToolchainResolutionFunction.java",
  "src/main/java/com/google/devtools/build/lib/skyframe/toolchains/ToolchainResolutionFunction.java",
  "src/main/java/com/google/devtools/build/lib/analysis/ResolvedToolchainContext.java",
  "src/main/java/com/google/devtools/build/lib/query2/aquery/ActionGraphTextOutputFormatterCallback.java",
  "rules_rust 0.73.0 rust/extensions.bzl",
  "rules_rust 0.73.0 rust/private/repositories.bzl",
  "rules_rust 0.73.0 rust/private/toolchain.bzl",
  "rules_rust 0.73.0 rust/private/rust.bzl",
  "rules_rust 0.73.0 rust/private/utils.bzl",
]
translation_notes = "The root module extension creates the rust_toolchains hub and tools repositories. Bazel parses the apparent registration pattern in the root mapping, expands only toolchain rules, configures them, selects the Rust toolchain for the host execution platform, loads its provider into the rust rule, and assigns that platform to Rustc/runfiles actions. Slug's future DICE owner and structural bytes remain Slug-native."
generation_command = "python3 -B -m tools.v2_oracle run --fixture rules-rust-073-toolchain-owner --tool bazel --bazel bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture rules-rust-073-toolchain-owner --tool bazel --bazel bazel"

[[commands]]
name = "expanded_generated_toolchain_rules"
argv = ["query", "kind(toolchain, @rust_toolchains//:all)", "--output=label", "--order_output=full", "--noshow_progress", "--lockfile_mode=off"]
expected_exit = 0
compare = "exact"

[[commands]]
