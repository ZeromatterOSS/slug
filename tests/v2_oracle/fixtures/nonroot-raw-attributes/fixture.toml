[fixture]
name = "nonroot-raw-attributes"
description = "Bazel 9.2 raw nonroot extension-tag and innate repository-rule attribute boundaries."
comparison = "semantic"
daemon = true
oracle_notes = "Local-path-only fixture. Successful root and subject consumers copy generated marker bytes with ctx.actions.expand_template into unique bazel-bin outputs; invalid rows have unique outputs that have never succeeded. The valid row primes string_ext and manifests its visible-lockfile entry. The invalid update row pins Bazel 9.2's AttributeValuesAdapter failure before tag schema validation."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/AttributeValues.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/AttributeValuesAdapter.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/Tag.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/TypeCheckedTag.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/InnateRunnableExtension.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/SingleExtensionUsagesValue.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/SingleExtensionEvalFunction.java",
]
translation_notes = "TagCallable and innate repository-rule proxies retain raw Starlark kwargs during MODULE evaluation. Later tag/repository-rule schema conversion and visible-lockfile serialization are separate boundaries."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-raw-attributes --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-raw-attributes --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "valid_structural_values_reach_tag_and_innate_consumers"
argv = ["build", "//:valid_tag", "//:valid_innate", "//:valid_update_prime", "--lockfile_mode=update"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/valid_tag.txt", "bazel-bin/valid_innate.txt", "bazel-bin/valid_update_prime.txt", "MODULE.bazel.lock"]

[[commands]]
name = "ordinary_tag_values_retain_post_call_list_and_dict_aliasing"
argv = ["build", "//:tag_alias", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
manifest_roots = ["bazel-bin/tag_alias.txt"]

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.0\""
  replace = "version = \"0.1.1\""

[[commands]]
name = "ordinary_tag_float_is_deferred_until_schema_validation"
argv = ["build", "//:tag_float", "--lockfile_mode=off"]
expected_exit = 1
stderr_contains = ["in 'float_value' tag", "expected value of type 'string'", "got 3.14 (float)"]
stderr_patterns = ["(?s)\\A(?!.*error executing MODULE[.]bazel)(?!.*AttributeValuesAdapter)(?!.*disk quota).*got 3[.]14 \\(float\\).*"]
manifest_roots = ["bazel-bin/tag_float.txt"]

  [[commands.mutations]]
  path = "modules/subject/MODULE.bazel"
  find = "tag_float_value = \"TAG_FLOAT_SENTINEL\""
  replace = "tag_float_value = 3.14"

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "version = \"0.1.1\""
  replace = "version = \"0.1.2\""

[[commands]]
name = "ordinary_tag_builtin_callable_is_deferred_until_schema_validation"
argv = ["build", "//:tag_print", "--lockfile_mode=off"]
expected_exit = 1
stderr_contains = ["in 'builtin_callable' tag", "expected value of type 'string'", "<built-in function print>", "builtin_function_or_method"]
stderr_patterns = ["(?s)\\A(?!.*error executing MODULE[.]bazel)(?!.*AttributeValuesAdapter)(?!.*@[0-9a-fA-F]{4,}).*<built-in function print>.*builtin_function_or_method.*"]
manifest_roots = ["bazel-bin/tag_print.txt"]

