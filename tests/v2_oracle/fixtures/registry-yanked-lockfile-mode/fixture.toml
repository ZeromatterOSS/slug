argv = ["mod", "graph", "--lockfile_mode=off", "--registry={{http_registry}}/first", "--registry={{http_registry}}/second", "--registry=https://bcr.bazel.build", "--repository_cache=../off-repository-cache", "--repo_contents_cache="]
expected_exit = 37
stderr_contains = ["Yanked version detected in your resolved dependency graph: yyy@1.0.0", "reason-a"]
stderr_patterns = ["(?s)\\A(?!.*reason-b).*reason-a"]

[[commands]]
name = "off_vendor_checksum_present_hit"
argv = ["mod", "graph", "--lockfile_mode=off", "--allow_yanked_versions=yyy@1.0.0", "--registry={{http_registry}}/first", "--registry={{http_registry}}/second", "--registry=https://bcr.bazel.build", "--vendor_dir=vendor-hit", "--repository_cache=", "--repo_contents_cache="]
expected_exit = 0
