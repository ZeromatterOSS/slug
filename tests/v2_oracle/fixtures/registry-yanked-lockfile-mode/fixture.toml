stdout_patterns = ["(?s)\\A(?!.*aaa@1\\.0\\.0)(?!.*olddep@1\\.0\\.0)(?!.*newdep@1\\.0\\.0).*yyy@1\\.0\\.0"]
stderr_patterns = ["(?s)\\A(?!.*Failed to read vendored registry file).*\\Z"]

  [[commands.mutations]]
  path = "MODULE.bazel"
  find = "module(name = \"registry_yanked_lockfile_mode\", version = \"0.1.0\")\nbazel_dep(name = \"yyy\", version = \"1.0.0\")\nbazel_dep(name = \"aaa\", version = \"1.0.0\")"
  replace = "module(name = \"registry_yanked_lockfile_mode\", version = \"0.1.1\")\nbazel_dep(name = \"yyy\", version = \"1.0.0\")"

