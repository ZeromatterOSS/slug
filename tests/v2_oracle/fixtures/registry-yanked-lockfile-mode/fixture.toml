stderr_patterns = ["(?s)\\A(?!.*Failed to fetch registry file)(?!.*module yyy@1\\.0\\.0 not found)(?!.*<http_registry>/second)(?!.*<root>).*Failed to read vendored registry file <http_registry>(?:<workspace>|/first/modules/yyy/1\\.0\\.0/MODULE\\.bazel at <workspace>)/vendor-fatal/_registries/127\\.0\\.0\\.1/first/modules/yyy/1\\.0\\.0/MODULE\\.bazel"]

