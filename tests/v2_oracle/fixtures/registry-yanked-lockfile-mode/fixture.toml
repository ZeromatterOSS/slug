[fixture]
name = "registry-yanked-lockfile-mode"
description = "Bazel 9.2 visible-lockfile registry Update, cold-cache Off, registry-file vendor, and Refresh oracle."
comparison = "semantic"
http_registry = true
http_registry_port = 0
manifest_roots = ["MODULE.bazel.lock", "http_registry_request_counts.json"]
oracle_notes = "A fixture-local loopback HTTP registry pins remote Update replay, a clean-expunge cold-cache Off sequence, checksum-present vendor hits, fatal vendored-read failure, missing and wrong-kind vendor fallback, vendor-input restoration, Refresh recorded-absence bypass, selected-yanked reuse, checksum enforcement, and checksum-before-yanked ordering. The three pre-existing Off rows share a fresh run-local repository cache and disable the contents cache; the five vendor Off rows and strengthened Refresh disable both caches explicitly. The BCR fallback is used only for Bazel's embedded-module closure; asserted transitions use the unique served modules."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RegistryFactoryImpl.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/RegistryFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/IndexRegistry.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/VendorManager.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelModuleResolutionFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelLockFileModule.java",
  "src/main/java/com/google/devtools/build/lib/bazel/commands/ModCommand.java",
  "src/main/java/com/google/devtools/build/lib/runtime/commands/CleanCommand.java",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/RepositoryOptions.java",
  "src/main/java/com/google/devtools/build/lib/bazel/BazelRepositoryModule.java",
  "src/main/protobuf/failure_details.proto",
]
translation_notes = "The first registry initially returns 404 for aaa while the second serves aaa -> olddep; a later mutation makes first serve aaa -> newdep. After Update records that absence, clean --expunge crosses an intentional cold server/output-base boundary while the workspace lockfile and request log survive. The three pre-existing Off rows use the initially absent ../off-repository-cache and --repo_contents_cache=. The five inserted Off rows advance the root version while switching checksum-present yyy among hit, fatal, missing, wrong-kind, and restored vendor trees, with both caches disabled; complete cumulative request manifests distinguish vendor selection and network fallback. Refresh uses vendor-hit: recorded-SHA yyy remains vendored, while checksum-empty aaa bypasses its present misleading vendor file and selects the live first-registry newdep bytes. Pinned CleanCommand.java supplies synchronous expunge/shutdown; VendorManager.java pins the portless _registries path and regular-file selection; RepositoryOptions and BazelRepositoryModule.java pin the workspace-relative vendor path and empty cache flags. Direct same-path vendor mutation, broader hash-mode policy, vendor commands, file registries, mirrors, and source archives are intentionally outside this oracle."
generation_command = "python3 -B -m tools.v2_oracle run --fixture registry-yanked-lockfile-mode --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture registry-yanked-lockfile-mode --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "update_records_selected_yanked_a"
argv = ["mod", "graph", "--lockfile_mode=update", "--allow_yanked_versions=yyy@1.0.0", "--registry={{http_registry}}/first", "--registry={{http_registry}}/second", "--registry=https://bcr.bazel.build"]
expected_exit = 0
stdout_contains = ["yyy@1.0.0", "aaa@1.0.0", "olddep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*newdep@1\\.0\\.0).*olddep@1\\.0\\.0"]

[[commands]]
name = "update_replays_absence_after_served_create"
argv = ["mod", "graph", "--lockfile_mode=update", "--allow_yanked_versions=yyy@1.0.0", "--registry={{http_registry}}/first", "--registry={{http_registry}}/second", "--registry=https://bcr.bazel.build"]
expected_exit = 0
stdout_contains = ["yyy@1.0.0", "aaa@1.0.0", "olddep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*newdep@1\\.0\\.0).*olddep@1\\.0\\.0"]

  [[commands.mutations]]
  path = "registry/first/modules/yyy/metadata.json"
  find = "reason-a"
  replace = "reason-b"

  [[commands.mutations]]
  op = "rename"
  path = "registry/first/modules/aaa/1.0.0/module.pending"
  destination = "registry/first/modules/aaa/1.0.0/MODULE.bazel"

[[commands]]
name = "off_probe_expunge"
argv = ["clean", "--expunge"]
expected_exit = 0

[[commands]]
name = "off_replays_recorded_absence"
argv = ["mod", "graph", "--lockfile_mode=off", "--allow_yanked_versions=yyy@1.0.0", "--registry={{http_registry}}/first", "--registry={{http_registry}}/second", "--registry=https://bcr.bazel.build", "--repository_cache=../off-repository-cache", "--repo_contents_cache="]
expected_exit = 0
stdout_contains = ["yyy@1.0.0", "aaa@1.0.0", "olddep@1.0.0"]
stdout_patterns = ["(?s)\\A(?!.*newdep@1\\.0\\.0).*olddep@1\\.0\\.0"]

[[commands]]
