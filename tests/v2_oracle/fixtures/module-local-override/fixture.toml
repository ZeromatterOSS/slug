[fixture]
name = "module-local-override"
description = "Root module depends on a local_path_override module and builds or queries a target from it."
comparison = "semantic"
manifest_roots = ["bazel-bin"]
oracle_notes = "Bazel 9.2 evidence covers both build and apparent-repository query output for a direct local_path_override."

[[commands]]
name = "build_dep_target"
argv = ["build", "@dep//:target.txt"]
compare = "semantic"
expected_exit = 0

[[commands]]
name = "query_dep_target"
argv = ["query", "@dep//:target.txt"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:target.txt"]

[[commands]]
name = "query_dep_files"
argv = ["query", "@dep//:files"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:files"]

[[commands]]
name = "query_dep_filegroup_srcs"
argv = ["query", "labels(srcs, @dep//:files)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:missing_input.txt", "@dep//:target.txt"]

[[commands]]
name = "query_dep_files_alias"
argv = ["query", "@dep//:files_alias"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:files_alias"]

[[commands]]
name = "query_dep_files_alias_actual"
argv = ["query", "labels(actual, @dep//:files_alias)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:files"]

[[commands]]
name = "query_dep_is_k8"
argv = ["query", "@dep//:is_k8"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:is_k8"]

[[commands]]
name = "query_dep_is_k8_label_kind"
argv = ["query", "--output=label_kind", "@dep//:is_k8"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["config_setting rule @dep//:is_k8"]

[[commands]]
name = "query_dep_suite_parent"
argv = ["query", "@dep//:suite_parent"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:suite_parent"]

[[commands]]
name = "query_dep_suite_parent_label_kind"
argv = ["query", "--output=label_kind", "@dep//:suite_parent"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["test_suite rule @dep//:suite_parent"]

[[commands]]
name = "query_dep_suite_parent_tests"
argv = ["query", "labels(tests, @dep//:suite_parent)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:suite_empty"]

[[commands]]
name = "query_dep_suite_parent_deps"
argv = ["query", "deps(@dep//:suite_parent)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:suite_empty", "@dep//:suite_parent"]

[[commands]]
name = "query_dep_suite_parent_expanded_tests"
argv = ["query", "tests(@dep//:suite_parent)"]
compare = "semantic"
expected_exit = 0

[[commands]]
name = "query_dep_package_group_parent"
argv = ["query", "@dep//:pg_parent"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:pg_parent"]

[[commands]]
name = "query_dep_package_group_parent_label_kind"
argv = ["query", "--output=label_kind", "@dep//:pg_parent"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["package group @dep//:pg_parent"]

[[commands]]
name = "query_dep_package_group_parent_deps"
argv = ["query", "deps(@dep//:pg_parent)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:pg_leaf", "@dep//:pg_parent"]

[[commands]]
name = "query_dep_package_group_cycle_deps"
argv = ["query", "deps(@dep//:pg_cycle_a)"]
compare = "semantic"
expected_exit = 0
stdout_contains = ["@dep//:pg_cycle_a", "@dep//:pg_cycle_b"]
