[fixture]
name = "module-include-change-invalidation"
description = "Bazel 9.2 fixture proving included MODULE.bazel fragments are semantic inputs in one output base."
comparison = "semantic"
oracle_notes = "The root MODULE.bazel includes deps.MODULE.bazel. One warm output base observes an included-fragment edit, its missing-file failure, and recreate recovery with the updated local repository content."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileGlobals.java",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/BazelDepGraphFunction.java",
]
translation_notes = "The local-path override keeps the include file itself as the only changing module-resolution input; this fixture makes no claim about module extensions or the hidden lockfile."
generation_command = "python3 -B -m tools.v2_oracle run --fixture module-include-change-invalidation --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture module-include-change-invalidation --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "build_before_include_edit"
argv = ["build", "//:copy_version"]
compare = "semantic"
expected_exit = 0
stderr_contains = ["Target //:copy_version up-to-date"]
manifest_roots = ["bazel-bin/version.out"]

[[commands]]
name = "build_after_include_edit"
argv = ["build", "//:copy_version"]
compare = "semantic"
expected_exit = 0
stderr_contains = ["Target //:copy_version up-to-date"]
manifest_roots = ["bazel-bin/version.out"]

  [[commands.mutations]]
  path = "deps.MODULE.bazel"
  find = "version = \"1.0.0\""
  replace = "version = \"2.0.0\""

  [[commands.mutations]]
  path = "deps.MODULE.bazel"
  find = "path = \"modules/dep_one\""
  replace = "path = \"modules/dep_two\""

[[commands]]
name = "build_after_include_delete"
argv = ["build", "//:copy_version"]
compare = "message_shape"
expected_exit = 48
stderr_contains = ["deps.MODULE.bazel", "not a regular file"]

  [[commands.mutations]]
  op = "delete"
  path = "deps.MODULE.bazel"

[[commands]]
name = "build_after_include_recreate"
argv = ["build", "//:copy_version"]
compare = "semantic"
expected_exit = 0
stderr_contains = ["Target //:copy_version up-to-date"]
manifest_roots = ["bazel-bin/version.out"]

  [[commands.mutations]]
  op = "create"
  path = "deps.MODULE.bazel"
  content = "bazel_dep(name = \"dep\", repo_name = \"dep_alias\", version = \"2.0.0\")\nlocal_path_override(module_name = \"dep\", path = \"modules/dep_two\")\n"
