stderr_patterns = ["(?s)\\A(?!.*ROOT_MAIN_POLICY_)(?!.*ROOT_REPO_POLICY_).*\\Z", "(?s)\\n - <workspace>/alternate/alternate/pkg(?!\\n - )"]

  [[commands.mutations]]
  op = "create"
  path = "pkg/BUILD"
  content = ""

