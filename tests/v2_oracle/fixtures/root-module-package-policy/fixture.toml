[fixture]
name = "root-module-package-policy"
description = "Bazel 9.2 retained-daemon oracle for root MODULE include package lookup, package-path priority, deleted/vendor policy, first-root .bazelignore, full REPO.bazel evaluation, prefix glob matching, event preflight, and recovery."
comparison = "semantic"
daemon = true
oracle_notes = "The first three rows prove every root include package is checked before any MODULE print. With --package_path=%workspace%:%workspace%/alternate, root1/pkg/BUILD beats root2/pkg/BUILD.bazel, proving package roots are outermost and BUILD names innermost; deleting root1's marker selects the alternate bytes under the same logical //pkg label. Later rows isolate all main deleted-package spellings, contained versus resolved-outside vendor directories, strictly first-file .bazelignore behavior, explicit-keyword-only REPO evaluation, warm print nonreplay, wildcard-prefix matching, failures, and same-daemon recovery. Reserved //external remains pinned-source evidence because a discriminating marker needs an unauthorized seeded directory; literal absolute outside-vendor argv spelling remains pinned-source evidence because the harness has no run-path argv token, while --vendor_dir=.. proves the same resolved absolute containment result."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java: computeForRootModule, advanceHorizon",
  "src/main/java/com/google/devtools/build/lib/skyframe/PackageLookupFunction.java: compute, findPackageByBuildFile",
  "src/main/java/com/google/devtools/build/lib/skyframe/IgnoredSubdirectoriesFunction.java: computeIgnoredPatterns, computeIgnoredPrefixes",
  "src/main/java/com/google/devtools/build/lib/skyframe/RepoFileFunction.java: readAndParseRepoFile, evalRepoFile",
  "src/main/java/com/google/devtools/build/lib/packages/RepoFileGlobals.java: repoCallable, ignoreDirectories",
  "src/main/java/com/google/devtools/build/lib/packages/RepoThreadContext.java",
  "src/main/java/com/google/devtools/build/lib/cmdline/IgnoredSubdirectories.java: matchingEntry",
  "src/main/java/com/google/devtools/build/lib/vfs/UnixGlob.java: matchesPrefix",
  "src/main/java/com/google/devtools/build/lib/actions/FileValue.java: isFile",
]
translation_notes = "The fixture is main-repository-only and has no registry or dependency scaffold. Both included fragments are checked seed inputs; the alternate fragment is temporarily rewritten for the logical-label diagnostic and then restored. BUILD markers and policy files are cumulative mutations. The alternate fragment serves both //alternate/pkg below the first package root and //pkg below the second root, discriminating logical include labels from selected package roots without duplicating assets. Every policy failure rejects the complete ROOT_MAIN_POLICY namespace, proving horizon package lookup before root or fragment execution. REPO prints remain separately namespaced so failure and warm replay are observable."
generation_command = "python3 -B -m tools.v2_oracle run --fixture root-module-package-policy --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture root-module-package-policy --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "missing_first_package_preflights_before_events"
argv = ["build", "//:probe", "--lockfile_mode=off", "--package_path=%workspace%:%workspace%/alternate"]
compare = "message_shape"
expected_exit = 48
stderr_contains = ["unable to load package for '//pkg:policy.MODULE.bazel' included at <workspace>/MODULE.bazel:3:1: BUILD file not found in any of the following directories. Add a BUILD file to a directory to mark it as a package.\n - <workspace>/pkg\n - <workspace>/alternate/pkg"]
stderr_patterns = ["(?s)\\A(?!.*ROOT_MAIN_POLICY_)(?!.*ROOT_REPO_POLICY_).*\\Z", "(?s)\\n - <workspace>/alternate/pkg(?!\\n - )"]

[[commands]]
name = "recovering_first_reports_second_before_events"
argv = ["build", "//:probe", "--lockfile_mode=off", "--package_path=%workspace%:%workspace%/alternate"]
