[fixture]
name = "cquery-executables-rule-capability"
description = "Bazel 9.2 cquery oracle for retained rule capability projection."
comparison = "message_shape"
oracle_notes = "This small configured-query slice reuses the accepted M3 executables rule-class source shape. It admits only existing configured literals, algebra, filter, some, and executables; no package traversal or metadata projection."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/ExecutablesFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeTargetAccessor.java#isExecutableNonTestRule",
  "src/main/java/com/google/devtools/build/lib/packages/TargetUtils.java#isExecutableNonTestRule",
]
translation_notes = "The predicate is retained Rule executable capability plus an exported rule class that does not end in _test. The BUILD target spelling is not classification state. Starlark label output makes the configured target identity observable without configuration checksum bytes."
generation_command = "python3 -B -m tools.v2_oracle run --fixture cquery-executables-rule-capability --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture cquery-executables-rule-capability --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "executable_non_test_rule"
argv = ["cquery", "executables(//pkg:arbitrary_target)", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A@@//pkg:arbitrary_target\\n?\\Z"]

[[commands]]
name = "executable_false_is_excluded"
argv = ["cquery", "executables(//pkg:plain)", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A\\Z"]

[[commands]]
name = "build_target_test_suffix_is_not_classification"
argv = ["cquery", "executables(//pkg:target_test)", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A@@//pkg:target_test\\n?\\Z"]

[[commands]]
name = "ordered_deduplicated_set"
argv = ["cquery", "executables(set(//pkg:target_test //pkg:plain //pkg:arbitrary_target //pkg:target_test))", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A@@//pkg:target_test\\n@@//pkg:arbitrary_target\\n?\\Z"]

[[commands]]
name = "nested_executables"
argv = ["cquery", "executables(executables(//pkg:arbitrary_target))", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A@@//pkg:arbitrary_target\\n?\\Z"]

[[commands]]
name = "filter_and_some_composition"
argv = ["cquery", "some(filter('^//pkg:', executables(set(//pkg:target_test //pkg:plain //pkg:arbitrary_target))), 2)", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A@@//pkg:target_test\\n@@//pkg:arbitrary_target\\n?\\Z"]

[[commands]]
name = "empty_operand"
argv = ["cquery", "executables(set())", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A\\Z"]

[[commands]]
name = "empty_result"
argv = ["cquery", "filter('^//missing:', executables(//pkg:arbitrary_target))", "--output=starlark", "--starlark:expr=str(target.label)"]
expected_exit = 0
stdout_patterns = ["\\A\\Z"]

[[commands]]
name = "missing_literal_is_eager"
argv = ["cquery", "executables(//pkg:not_found union //pkg:arbitrary_target)"]
expected_exit = 1
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such target '//pkg:not_found'"]

[[commands]]
name = "executable_rule_requires_default_info_executable"
argv = ["cquery", "//pkg:missing_exec"]
expected_exit = 1
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["The rule 'missing_exec' is executable. It needs to create an executable File"]

[[commands]]
name = "too_few_arguments"
argv = ["cquery", "executables()"]
expected_exit = 2
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["too few arguments to function 'executables'"]

[[commands]]
name = "too_many_arguments"
argv = ["cquery", "executables(//pkg:plain, //pkg:arbitrary_target)"]
expected_exit = 2
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["too many arguments to function 'executables'"]
