[fixture]
name = "query-some-selection"
description = "Bazel 9.2 ordinary-query oracle for some() arbitrary selection, signed Java-int counts, and complete operand demand."
comparison = "message_shape"
oracle_notes = "Root-only ordinary-query slice. The fixture contains no generated/output nodes, external repositories, configured state, or Sky Query flags. some() alternatives are bounded only to complete valid members/subsets and never claim a winning label."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/SomeFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/engine/QueryEnvironment.java#EvaluateExpression",
  "src/main/java/com/google/devtools/build/lib/query2/common/AbstractBlazeQueryEnvironment.java#AbstractBlazeQueryEvaluateExpressionImpl",
  "src/main/java/com/google/devtools/build/lib/query2/SkyQueryEnvironment.java#SkyQueryEvaluateExpressionImpl",
  "src/main/java/com/google/devtools/build/lib/query2/QueryEnvironmentFactory.java#canUseSkyQuery",
  "src/main/java/com/google/devtools/build/lib/query2/engine/QueryParser.java#consumeIntLiteral",
  "src/main/java/com/google/devtools/build/lib/query2/engine/Lexer.java",
  "src/main/java/com/google/devtools/build/lib/runtime/commands/QueryCommand.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/QueryOutputUtils.java",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSomeOperator_noCountParameter",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSomeOperator_countParameterNotEqualActualCount",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSomeOperator_nestedSomeTest",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testUnconditionalQueryException",
]
translation_notes = "Migrates Bazel SomeFunction and AbstractQueryTest themes into a root-only filegroup graph. Stop probes prove ordinary query evaluates later union/set operands despite an early selectable node and emits no partial stdout on the resulting failure. Java signed-int parsing is exercised both for some() and existing deps/rdeps depth arguments; expression-position integers remain target literals."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-some-selection --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-some-selection --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "stop_union_missing_target_after_early_candidate"
argv = ["query", "some(//:early union //:missing_target, 1)"]
expected_exit = 7
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such target '//:missing_target'"]

[[commands]]
name = "stop_set_missing_target_after_early_candidate"
argv = ["query", "some(set(//:early //:missing_target), 1)"]
expected_exit = 7
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such target '//:missing_target'"]

[[commands]]
name = "stop_union_missing_package_after_early_candidate"
argv = ["query", "some(//:early union //missing:target, 1)"]
expected_exit = 7
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such package 'missing': BUILD file not found"]

[[commands]]
name = "stop_set_missing_package_after_early_candidate"
argv = ["query", "some(set(//:early //missing:target), 1)"]
expected_exit = 7
stdout_patterns = ["\\A\\Z"]
stderr_patterns = ["no such package 'missing': BUILD file not found"]

