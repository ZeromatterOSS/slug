[fixture]
name = "nonroot-repository-path-state-symlinks"
description = "Retained-daemon oracle for non-root repository path state through symlinked ancestors, escaped roots, leaf bytes, lifecycle transitions, cycles, and descendant expansion."
comparison = "semantic"
daemon = true
oracle_notes = "The subject module evaluates its logical payload before the fixture-local escaped payload. One stable logical package starts through a two-hop directory alias, retargets A to B to A, becomes dangling, self-cyclic, or descendant-expanding, and recovers. Both payload leaves are symlinks to regular fragment bytes. BUILD.bazel priority and BUILD fallback are exercised only in backing A. Parked checked links pin the two distinct Bazel symlink errors without requiring the harness to create links."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/skyframe/FileFunction.java: compute, resolveFromAncestors, getSymlinkTargetRootedPath, checkAndNotePathSeenDuringPartialResolution",
  "src/main/java/com/google/devtools/build/lib/actions/FileValue.java",
  "src/main/java/com/google/devtools/build/lib/actions/FileStateValue.java",
  "src/main/java/com/google/devtools/build/lib/skyframe/ExternalFilesHelper.java",
  "src/main/java/com/google/devtools/build/lib/skyframe/PackageLookupFunction.java: getFileValue, computeExternalPackageLookupValue",
  "src/test/java/com/google/devtools/build/lib/skyframe/FileFunctionTest.java: testExternalRelativeSymlink, testSymlinkAsAncestor, testTwoSymlinksInAncestors, testSymlinkTargetChange, symlink cycle and infinite expansion tests",
  "src/main/java/com/google/devtools/build/lib/bazel/bzlmod/ModuleFileFunction.java: advanceHorizon, execModuleFile",
]
translation_notes = "All checked links are relative and remain within the copied workspace. The escape link leaves only the overridden subject repository and resolves to workspace/modules/outside. Absolute host links, special files, ordinary permission failures, and Windows reparse behavior remain source-derived. Ordered exact-once prints prove horizon preflight, current bytes, target routing, recovery, and warm nonreplay."
generation_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-repository-path-state-symlinks --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture nonroot-repository-path-state-symlinks --tool bazel --bazel /usr/bin/bazel"

[[commands]]
name = "baseline_two_hop_ancestor_orders_payload_then_escape"
argv = ["build", "//:probe", "--lockfile_mode=off"]
expected_exit = 0
stderr_contains = ["Build completed successfully"]
stderr_patterns = ["(?s)\\A(?:(?!NONROOT_PATH_STATE_PAYLOAD_A|NONROOT_PATH_STATE_PAYLOAD_EDIT|NONROOT_PATH_STATE_PAYLOAD_B|NONROOT_PATH_STATE_ESCAPE).)*NONROOT_PATH_STATE_PAYLOAD_A(?:(?!NONROOT_PATH_STATE_PAYLOAD_A|NONROOT_PATH_STATE_PAYLOAD_EDIT|NONROOT_PATH_STATE_PAYLOAD_B|NONROOT_PATH_STATE_ESCAPE).)*NONROOT_PATH_STATE_ESCAPE(?:(?!NONROOT_PATH_STATE_PAYLOAD_A|NONROOT_PATH_STATE_PAYLOAD_EDIT|NONROOT_PATH_STATE_PAYLOAD_B|NONROOT_PATH_STATE_ESCAPE).)*\\Z"]

