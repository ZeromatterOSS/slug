[fixture]
name = "bazel-lockfile-v28-schema"
description = "Bazel 9.2 exact visible MODULE.bazel.lock v28 schema and adapter-boundary oracle."
comparison = "semantic"
http_registry = true
http_registry_port = 0
oracle_notes = "A self-contained extension first generates all real Bazel v28 domains available to module_ctx. Later command-local mutations exercise retained schema and adapter boundaries; no template asset or harness behavior is used."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
