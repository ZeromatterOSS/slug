[fixture]
name = "load-invalidation"
description = "A loaded .bzl file edit changes the output produced by a second build in the same daemon."
comparison = "semantic"
manifest_roots = ["bazel-bin/pkg"]
daemon = true
oracle_notes = "Same-daemon DICE invalidation: the second build runs in the same slug daemon, detects the message.bzl edit, and replays the affected computation."

[reapi]
remote_executor = true

[[commands]]
name = "prime"
argv = ["build", "//pkg:message"]
compare = "semantic"
expected_exit = 0

[[commands]]
name = "after_bzl_edit"
argv = ["build", "//pkg:message"]
compare = "semantic"
expected_exit = 0

[[commands.mutations]]
path = "pkg/message.bzl"
find = "MESSAGE = \"one\""
replace = "MESSAGE = \"two\""
