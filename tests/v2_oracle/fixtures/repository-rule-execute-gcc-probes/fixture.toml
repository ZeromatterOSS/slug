[fixture]
name = "repository-rule-execute-gcc-probes"
description = "Bazel 9.2 repository_ctx.execute reads generated GCC source before and after ordered six- and seven-effect prefixes."
comparison = "semantic"
startup_argv = ["--ignore_all_rc_files"]
env = { PATH = "/usr/bin:/bin", LC_ALL = "C" }
oracle_notes = "Offline Linux GCC probes with bounded PATH. The original repository writes tools/cpp/empty.cc and executes the source-authenticated GCC -v, --version, and compiler-option forms. An independent repository links an exported file from a local-override source module twice, writes the same empty.cc and three inert executable file effects, then executes rules_cc's lld-discovery argv. A third independent repository repeats that ordered prefix, writes a small synthetic default-executable builtin_include_directory_paths file, and executes rules_cc's first following -Wthread-safety compiler-option argv. The rows check stable result fields without requiring linker success or GCC support for that option. No module download, credential RC, copied upstream archive, or temporary Bazel output base is included."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkBaseExternalContext.java:1898-1922,1939-2075 (execute arguments, defaults, path conversion, local execution)",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkExecutionResult.java:59-111,192-250 (return_code/stdout/stderr and nonzero-as-result)",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkBaseExternalContext.java:1444-1503 (preceding repository_ctx.file)",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkRepositoryContext.java:259-358 (template output is executable by default)",
  "rules_cc 0.2.17 cc/private/toolchain/unix_cc_configure.bzl:144-154,216-235,273-283,372,561-566 (GCC argv forms and generated empty.cc)",
  "rules_cc 0.2.17 cc/private/toolchain/unix_cc_configure.bzl:166-190,362-372,430-495 (ordered symlink/file/template prefix and lld-discovery argv)",
  "rules_cc 0.2.17 cc/private/toolchain/lib_cc_configure.bzl:282-303 (builtin include-directory file branches)",
  "rules_cc 0.2.17 cc/private/toolchain/unix_cc_configure.bzl:144-154,627-669 (seventh effect and first following compiler-option argv)",
]
translation_notes = "The original two rows remain unchanged: the first minimal local rule fixes PATH, checks stable GCC version/result fields, and compiles generated empty.cc to /dev/null; the second uses one tiny local-override module as the external symlink source and synthetic inert ctx.file contents at the three source-named template destinations. The third independent row reuses that source module and preceding effect shape, adding a synthetic inert seventh file with Bazel's default executable mode. It proves ordered seven-effect staging and the source-authenticated -Wthread-safety argv/result protocol, not authentic compiler-reported include-directory bytes or template-source provenance. Linker and compiler-option return codes may vary by host. Other GCC flags, custom execution options, Clang, arbitrary executables, host process output bytes, and full toolchain closure remain outside these rows."
generation_command = "python3 -B -m tools.v2_oracle run --fixture repository-rule-execute-gcc-probes --tool bazel --bazel /usr/bin/bazel --run-root <fresh-generation-root> --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture repository-rule-execute-gcc-probes --tool bazel --bazel /usr/bin/bazel --run-root <independent-fresh-root>"

[[commands]]
name = "gcc_execute_generated_file_and_result_fields"
