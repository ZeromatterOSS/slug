[fixture]
name = "repository-rule-execute-gcc-probes"
description = "Bazel 9.2 repository_ctx.execute exposes GCC version streams and reads a preceding generated source file."
comparison = "semantic"
startup_argv = ["--ignore_all_rc_files"]
env = { PATH = "/usr/bin:/bin", LC_ALL = "C" }
oracle_notes = "Offline Linux GCC probe with a bounded PATH. A repository rule writes tools/cpp/empty.cc, then executes the source-authenticated rules_cc GCC -v, --version, and compiler-option probe argv forms. It checks result fields before writing the queried target. No module download, credential RC, copied upstream archive, or temporary Bazel output base is included."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkBaseExternalContext.java:1898-1922,1939-2075 (execute arguments, defaults, path conversion, local execution)",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkExecutionResult.java:59-111,192-250 (return_code/stdout/stderr and nonzero-as-result)",
  "src/main/java/com/google/devtools/build/lib/bazel/repository/starlark/StarlarkBaseExternalContext.java:1444-1503 (preceding repository_ctx.file)",
  "rules_cc 0.2.17 cc/private/toolchain/unix_cc_configure.bzl:144-154,216-235,273-283,372,561-566 (GCC argv forms and generated empty.cc)",
]
translation_notes = "The fixture uses a minimal local repository rule instead of the complete rules_cc local_config_cc graph. It fixes PATH to find the host GCC and checks only stable fields: -v succeeds with version text on stderr, --version succeeds with GCC text on stdout, and the exact -fno-canonical-system-headers compiler-option probe succeeds with empty stdout after reading generated empty.cc. The source-authenticated option probe writes only /dev/null. Nonzero result fields, other GCC flags, custom execution options, Clang, arbitrary executables, host process output bytes, and toolchain closure are outside this oracle row."
generation_command = "python3 -B -m tools.v2_oracle run --fixture repository-rule-execute-gcc-probes --tool bazel --bazel /usr/bin/bazel --run-root <fresh-generation-root> --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture repository-rule-execute-gcc-probes --tool bazel --bazel /usr/bin/bazel --run-root <independent-fresh-root>"

[[commands]]
name = "gcc_execute_generated_file_and_result_fields"
argv = ["query", "@selected//:gcc_probes", "--output=label", "--noshow_progress"]
expected_exit = 0
stdout_patterns = ['\A@selected//:gcc_probes\n?\Z']
