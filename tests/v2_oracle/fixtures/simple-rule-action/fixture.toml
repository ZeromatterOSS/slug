[fixture]
name = "simple-rule-action"
description = "A custom Starlark rule declares and writes one output file."
comparison = "semantic"
manifest_roots = ["bazel-bin/pkg"]
oracle_notes = "Bazel progress output is volatile; compare the declared output manifest and digest generated with upstream Bazel 9."

[reapi]
default_exec_properties = ["container-image=selected:v1"]
worker_platform_properties = ["container-image=selected:v1"]
remote_executor = true

[[commands]]
name = "build_write_file"
argv = ["build", "//pkg:write_file"]
compare = "message_shape"
expected_exit = 0

[[commands]]
name = "build_write_file_b"
argv = ["build", "//pkg:write_file"]
compare = "message_shape"
expected_exit = 0

  [[commands.mutations]]
  path = "pkg/defs.bzl"
  find = 'CONTENT = "hello from an action\n"'
  replace = 'CONTENT = "changed FileWrite content\n"'

[[commands]]
name = "build_write_file_restored_a"
argv = ["build", "//pkg:write_file"]
compare = "message_shape"
expected_exit = 0

  [[commands.mutations]]
  path = "pkg/defs.bzl"
  find = 'CONTENT = "changed FileWrite content\n"'
  replace = 'CONTENT = "hello from an action\n"'
