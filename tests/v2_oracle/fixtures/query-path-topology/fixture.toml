[fixture]
name = "query-path-topology"
description = "Bazel 9.2 root-repository loading-query oracle for allpaths, somepath, and explicit label output over source and rule topology."
comparison = "message_shape"
oracle_notes = "Root-only label loading-query slice. The workspace has no generated/output nodes, analysis, external repositories, or filesystem-sensitive query functions. somepath is arbitrary by Bazel contract: the bounded alternatives below admit only complete forward shortest paths. QueryCommand deliberately preserves a top-level somepath's forward path for default/auto rather than applying lexicographic AUTO sorting. Explicit label rows prove equivalence with default output under auto/full order and Bazel 9 rejection of prototype-only text output."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/AllPathsFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/engine/SomePathFunction.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/BlazeQueryEnvironment.java",
  "src/main/java/com/google/devtools/build/lib/runtime/commands/QueryCommand.java",
  "src/main/java/com/google/devtools/build/lib/query2/engine/QueryExpression.java#isTopLevelSomePathFunction",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/LabelOutputFormatter.java",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/OutputFormatters.java",
  "src/main/java/com/google/devtools/build/lib/runtime/commands/QueryEnvironmentBasedCommand.java",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSomePathOperator",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testSomePathOperatorOrdering",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testAllPathsOperator",
]
translation_notes = "Migrates the AbstractQueryTest path themes to a minimal root-only filegroup/alias/custom-label-list graph. Generated/output-file topology from testPathOperatorsWithOutputFile is intentionally omitted. Integer operands are expression-position target patterns and retain the existing //:1 missing-target exit-7 behavior. QueryCommand's top-level-somepath exception preserves forward shortest-path order for default and auto output, requiring a dedicated V2 ordering seam rather than ordinary auto sorting."
generation_command = "python3 -B -m tools.v2_oracle run --fixture query-path-topology --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture query-path-topology --tool bazel --bazel /usr/bin/bazel"

