  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testTestsOperatorFiltersByTagSizeAndEnv",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testTestsOperatorCrossesPackages",
