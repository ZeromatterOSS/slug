  "src/main/java/com/google/devtools/build/lib/packages/RuleClass.java#checkForDuplicateLabels",
  "src/main/java/com/google/devtools/build/lib/packages/AggregatingAttributeMapper.java#checkForDuplicateLabels",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/BuildOutputFormatter.java#outputRule",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/ProtoOutputFormatter.java#shouldIncludeAttribute",
  "src/main/java/com/google/devtools/build/lib/query2/query/output/StreamedJSONProtoOutputFormatter.java",
