[fixture]
name = "tests-query-expansion"
description = "Bazel 9.2.0 ordinary-query oracle for tests(EXPR) suite expansion, filtering, strictness, and output order."
comparison = "message_shape"
oracle_notes = "Root-repository, bzlmod-only fixture. Multi-result tests() rows assert exactly the expected label set but deliberately permit every callback order Bazel's asynchronous suite traversal can produce."

[provenance]
bazel_release = "9.2.0"
bazel_commit = "8220c6198837d5c13d53fea211cf3282aa12408a"
source_anchors = [
  "src/main/java/com/google/devtools/build/lib/query2/engine/TestsFunction.java",
  "src/main/java/com/google/devtools/build/lib/packages/TestSuiteImplicitTestsAccumulator.java",
