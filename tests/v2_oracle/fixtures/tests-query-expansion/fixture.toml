  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testTestsOperatorReportsMissingTargets",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testStrictTestSuiteWithFile",
  "src/test/java/com/google/devtools/build/lib/query2/testutil/AbstractQueryTest.java#testTestSuiteWithFile",
]
translation_notes = "TestsFunction partitions direct tests, suites, and other targets; uniquely visits suites/tests; filters explicit and implicit tests using tags plus size; and treats suite tag manual as a property, not a filter. TestSuiteImplicitTestsAccumulator supplies only same-package non-manual tests for an empty suite. AttributeProvider retains the loading representation, and AbstractQueryTest#testTestSuiteWithFile establishes that ordinary deps retains an explicit file-member edge even though tests() filtering is separate. The provenance rows pin Bazel's orthogonal explicitness: omitted and explicit-empty tests both receive identical $implicit_tests membership, while --output=build prints tests = [] only for the explicitly supplied value. BuildType naturally sorts direct order-independent lists. Bazel's default internal UTF-8-byte-string parser path makes literal tag order match Rust byte order and retains duplicate strings. Label natural order is structural by repository, package, and target rather than rendered spelling. RuleClass rejects duplicate canonical labels after conversion, so equivalent bare and colon suite-member spellings fail. Configurable selector duplicates and malformed input bytes are not claimed. This oracle is loading-representation-only: its build-format rows require state distinctions but grant no Slug formatter acceptance. V1 test-suite/accessor storage and Buck2 evaluator/sets are reference-only: this oracle imports no V1/Buck2 implementation."
generation_command = "python3 -B -m tools.v2_oracle run --fixture tests-query-expansion --tool bazel --bazel /usr/bin/bazel --update-expected"
verification_command = "python3 -B -m tools.v2_oracle run --fixture tests-query-expansion --tool bazel --bazel /usr/bin/bazel"

